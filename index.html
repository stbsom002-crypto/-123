<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여행 경비 관리자</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .summary-card {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .summary-card h2 {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.9;
        }

        .summary-card .total-amount {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .form-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .expense-list {
            list-style: none;
        }

        .expense-item {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-info .merchant {
            font-size: 1rem;
            font-weight: 600;
        }

        .expense-info .date {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .expense-amount-area {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .expense-amount {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 30px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>✈️ 여행 경비 관리</h1>
    </header>

    <div class="summary-card">
        <h2>총 지출 금액</h2>
        <div class="total-amount" id="totalAmount">0 원</div>
    </div>

    <form class="form-card" id="expenseForm">
        <div class="form-group">
            <label for="date">날짜</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="merchant">업체명</label>
            <input type="text" id="merchant" placeholder="예: 스타벅스, 호텔" required>
        </div>
        <div class="form-group">
            <label for="amount">금액 (원)</label>
            <input type="number" id="amount" placeholder="0" required min="0">
        </div>
        <button type="submit" class="btn-submit">내역 추가하기</button>
    </form>

    <ul class="expense-list" id="expenseList"></ul>

    <script>
        // 오늘 날짜를 기본값으로 설정
        document.getElementById('date').valueAsDate = new Date();

        let expenses = JSON.parse(localStorage.getItem('tripExpenses')) || [];

        function saveAndRender() {
            localStorage.setItem('tripExpenses', JSON.stringify(expenses));
            render();
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('ko-KR').format(num) + ' 원';
        }

        function render() {
            const listEl = document.getElementById('expenseList');
            const totalEl = document.getElementById('totalAmount');
